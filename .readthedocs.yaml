version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  apt_packages:
    - graphviz
    - rsync
    - unzip

  commands:
    - pip install -r docs/requirements.txt
    - mkdir -p $READTHEDOCS_OUTPUT/html
    # - unzip docs/mva_docs.zip -d $READTHEDOCS_OUTPUT/html
    - python -m pip install --upgrade --no-cache-dir sphinx readthedocs-sphinx-ext 
    - python -m sphinx -T -W --keep-going -b html -d _build/doctrees -D language=en -c docs . $READTHEDOCS_OUTPUT/html 
