version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  apt_packages:
    - graphviz
  jobs:
    post_build:
      - mkdir -p ${READTHEDOCS_OUTPUT}/html/mathvizanimator/
      - cp --recursive mathvizanimator/ ${READTHEDOCS_OUTPUT}/html/mathvizanimator/

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true